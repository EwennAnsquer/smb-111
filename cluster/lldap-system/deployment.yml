---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lldap
  namespace: lldap-system
  labels:
    app.kubernetes.io/name: lldap
spec:
  replicas: 1                 # SQLite => 1 seul réplica
  strategy:
    type: Recreate            # évite deux pods sur le même PVC (ReadWriteOnce)
  selector:
    matchLabels:
      app.kubernetes.io/name: lldap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lldap
    spec:
      containers:
        - name: lldap
          # Image officielle. `stable` = dernière version stable ; à épingler sur un tag/digest
          # (ex. via Renovate) une fois que tout fonctionne.
          image: lldap/lldap:stable
          imagePullPolicy: IfNotPresent
          ports:
            - name: ldap
              containerPort: 3890
            - name: http
              containerPort: 17170
          env:
            - name: TZ
              value: Europe/Paris
            - name: LLDAP_LDAP_BASE_DN
              value: dc=azby,dc=fr                        # doit correspondre à Authelia
            - name: LLDAP_LDAP_USER_EMAIL
              value: admin@azby.fr
            - name: LLDAP_HTTP_URL
              value: https://lldap.smb-111.azby.fr
            - name: LLDAP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: lldap-secrets
                  key: jwt-secret
            - name: LLDAP_KEY_SEED
              valueFrom:
                secretKeyRef:
                  name: lldap-secrets
                  key: key-seed
            - name: LLDAP_LDAP_USER_PASS
              valueFrom:
                secretKeyRef:
                  name: lldap-secrets
                  key: admin-password
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lldap-data
