# Utilisateurs lldap déclarés en code (contient des mots de passe en clair :
# à CHIFFRER avec SOPS avant de le pousser dans git).
#
# - Un fichier .json par utilisateur.
# - Mot de passe : 8 caractères minimum (sinon lldap refuse).
# - "groups" accepte les groupes déclarés dans bootstrap-groups.yml
#   ainsi que les groupes intégrés de lldap (lldap_admin, lldap_password_manager,
#   lldap_strict_readonly).
# - Les mots de passe sont réappliqués à chaque exécution du CronJob :
#   ce fichier est la source de vérité (un changement fait dans l'interface web sera écrasé).
