---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia-release
  namespace: authelia-system
spec:
  interval: 10m
  chart:
    spec:
      chart: authelia
      version: 0.11.22
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: authelia-system
      reconcileStrategy: ChartVersion
  values:
    secret:
      existingSecret: authelia-secret
    pod:
      extraVolumes:
        - name: users-db
          configMap:
            name: authelia-users
      extraVolumeMounts:
        - name: users-db
          mountPath: /config/users_database.yml
          subPath: users_database.yml
          readOnly: true
    configMap:
      theme: dark
      log:
        level: info
      authentication_backend:
        file:
          path: /config/users_database.yml
      storage:
        local:
          path: /config/db.sqlite3
      notifier:
        filesystem:
          filename: /config/notification.txt
      access_control:
        default_policy: deny
        rules:
          - domain: "*.smb-111.azby.fr"
            policy: one_factor
      session:
        cookies:
          - domain: smb-111.azby.fr
            subdomain: auth
            default_redirection_url: https://auth.smb-111.azby.fr
