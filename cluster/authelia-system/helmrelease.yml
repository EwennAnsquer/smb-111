---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia-release
  namespace: authelia-system
spec:
  chart:
    spec:
      chart: authelia
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: authelia-system
      version: 0.11.22
  interval: 1m0s
  values:
    secret:
      existingSecret: authelia-secret
    pod:
      extraVolumes:
        - name: users-db
          configMap:
            name: authelia-users
      extraVolumeMounts:
        - name: users-db
          mountPath: /config/users_database.yml
          subPath: users_database.yml
    configMap:
      theme: dark
      server:
        address: 'tcp://0.0.0.0:9091/'
      log:
        level: info
      authentication_backend:
        file:
          path: /config/users_database.yml
        password_reset:
          disable: false
          custom_url: ''
        password_change:
          disable: false
      storage:
        local:
          path: /config/db.sqlite3
      notifier:
        filesystem:
          filename: /config/notification.txt
      access_control:
        default_policy: deny
        rules:
          - domain: "*.smb-111.azby.fr"
            policy: one_factor
      session:
        cookies:
          - domain: smb-111.azby.fr
            authelia_url: https://auth.smb-111.azby.fr
            default_redirection_url: https://auth.smb-111.azby.fr

