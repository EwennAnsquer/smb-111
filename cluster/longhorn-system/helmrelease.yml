---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-release
  namespace: longhorn-system
spec:
  chart:
    spec:
      chart: longhorn
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn-repo
      version: v1.12.1
  interval: 1m0s
  values:
    defaultSettings:
      backupTarget: "s3://smb-111@us-east-1/"
      backupTargetSecret: "minio-backup-secret"
