---
- name: Vérifier la version de la CLI Flux installée
  ansible.builtin.command: flux version --client
  register: flux_cli_check
  failed_when: false
  changed_when: false
  check_mode: false

- name: "Télécharger et installer la CLI Flux {{ flux_version }}"
  ansible.builtin.shell: |
    curl -s {{ flux_bootstrap_install_url }} | FLUX_VERSION={{ flux_version }} bash
  when: flux_cli_check.rc != 0 or (flux_version not in flux_cli_check.stdout)

- name: Déploiement de Flux sur le cluster
  environment:
    KUBECONFIG: "{{ flux_bootstrap_kubeconfig }}"
  block:
    - name: Vérifier si Flux est déjà installé sur le cluster
      ansible.builtin.command: kubectl -n {{ flux_bootstrap_namespace }} get deploy source-controller
      register: flux_installed_check
      failed_when: false
      changed_when: false
      check_mode: false

    - name: "Créer le namespace {{ flux_bootstrap_namespace }}"
      ansible.builtin.shell: |
        kubectl create namespace {{ flux_bootstrap_namespace }} --dry-run=client -o yaml | kubectl apply -f -
      changed_when: false

    - name: Créer le secret sops-age (déchiffrement SOPS par Flux)
      ansible.builtin.shell: |
        kubectl -n {{ flux_bootstrap_namespace }} create secret generic sops-age \
          --from-literal=age.agekey="$AGE_KEY" \
          --dry-run=client -o yaml | kubectl apply -f -
      environment:
        AGE_KEY: "{{ sops_age_key }}"
      changed_when: false
      no_log: true

    - name: Générer les secrets OIDC d'Authelia (une seule fois)
      ansible.builtin.shell: |
        set -e
        kubectl create namespace authelia-system --dry-run=client -o yaml | kubectl apply -f -
        if kubectl -n authelia-system get secret authelia-oidc >/dev/null 2>&1; then
          exit 0
        fi
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        openssl genrsa -out "$tmp/oidc.jwks.rsa.4096.pem" 4096
        kubectl -n authelia-system create secret generic authelia-oidc \
          --from-file=oidc.jwks.rsa.4096.pem="$tmp/oidc.jwks.rsa.4096.pem" \
          --from-literal=identity_providers.oidc.hmac.key="$(openssl rand -hex 32)"
      args:
        executable: /bin/bash
      register: authelia_oidc
      changed_when: "'secret/authelia-oidc created' in authelia_oidc.stdout"

    - name: Exécuter Flux Bootstrap Github (uniquement au tout premier déploiement)
      ansible.builtin.command: >
        flux bootstrap github
        --owner={{ github_user }}
        --repository={{ github_repo }}
        --branch={{ github_branch }}
        --path={{ target_path }}
        --personal
        --reconcile
      environment:
        GITHUB_TOKEN: "{{ github_token }}"
      register: flux_bootstrap
      changed_when: true
      when: flux_installed_check.rc != 0
      no_log: true

