---
- name: Attendre la fin de cloud-init
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  failed_when: false

# Politique de mise à jour : `safe` applique les correctifs sans supprimer de
# paquets ni forcer une résolution risquée. Les correctifs de sécurité sont
# ensuite gérés par unattended-upgrades (rôle hardening). Aucun redémarrage
# automatique : un nouveau noyau reste inactif jusqu'au prochain passage de
# maintenance.yml (drain, reboot, uncordon, un nœud à la fois).
- name: Mettre à jour les paquets
  ansible.builtin.apt:
    update_cache: true
    upgrade: safe
    autoremove: true
    lock_timeout: 120
  register: common_apt_result
  retries: 3
  delay: 10
  until: common_apt_result is succeeded

- name: Installation des paquets
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Activer iscsid (requis par Longhorn)
  ansible.builtin.systemd:
    name: iscsid
    state: started
    enabled: true

- name: Désactiver le swap (immédiat)
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Désactiver le swap (persistant, /etc/fstab)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'
