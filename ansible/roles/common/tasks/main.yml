---
- name: Attendre la fin de cloud-init
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  failed_when: false

- name: Mettre à jour les paquets
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    lock_timeout: 120
  register: apt_result
  retries: 3
  delay: 10
  until: apt_result is succeeded

- name: Installation des paquets
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Activer iscsid (requis par Longhorn)
  ansible.builtin.systemd:
    name: iscsid
    state: started
    enabled: yes

- name: Désactiver le swap (immédiat)
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Désactiver le swap (persistant, /etc/fstab)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

