---
- name: Installer ufw et unattended-upgrades
  ansible.builtin.apt:
    name:
      - ufw
      - unattended-upgrades
    state: present
    update_cache: true

# ---------- Pare-feu ----------
# Les règles sont ajoutées AVANT d'activer ufw, pour ne pas se couper l'accès SSH.
#
# Flux entrants autorisés :
#   - 22/tcp          : administration (SSH) depuis le réseau local
#   - 80/443/tcp      : Ingress Traefik (klipper-lb hostPort) depuis le réseau local
#   - 6443/tcp        : API Kubernetes sur les masters (administration)
#   - tout protocole  : entre nœuds du cluster (voir la règle inter-nœuds)
#   - 30000-32767/tcp : NodePorts, uniquement si explicitement activés
#
# Flux non concernés par ufw :
#   - kube-vip en mode ARP (vip_arp=true) : annonces ARP de niveau 2, non
#     filtrées par ufw ; VRRP (protocole 112) n'est pas utilisé.
#   - Tailscale : l'operator et ses proxies initient leurs connexions vers
#     l'extérieur ; aucun port d'écoute n'est exposé sur les nœuds.

- name: Autoriser SSH depuis les sources d'administration
  community.general.ufw:
    rule: allow
    src: "{{ item.0 }}"
    to_port: "{{ item.1 }}"
    proto: tcp
    comment: "admin {{ item.1 }}"
  loop: "{{ hardening_admin_sources | product(hardening_admin_ports) | list }}"

- name: Autoriser l'ingress HTTP et HTTPS depuis le réseau local
  community.general.ufw:
    rule: allow
    src: "{{ item.0 }}"
    to_port: "{{ item.1 }}"
    proto: tcp
    comment: "ingress {{ item.1 }}"
  loop: "{{ hardening_admin_sources | product(hardening_ingress_tcp_ports) | list }}"

- name: Autoriser l'API Kubernetes (6443) sur les masters
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    to_port: "6443"
    proto: tcp
    comment: "API Kubernetes"
  loop: "{{ hardening_admin_sources }}"
  when: inventory_hostname in groups['masters']

# Règle large et volontaire : elle couvre les flux suivants entre nœuds.
#   - API Kubernetes 6443/tcp (dont jointure des serveurs via la VIP)
#   - kubelet 10250/tcp (logs, exec, métriques)
#   - etcd 2379-2380/tcp (quorum et réplication)
#   - VXLAN flannel 8472/udp (réseau des pods)
#   - iSCSI Longhorn 3260/tcp (cibles exposées par les nœuds)
#   - métriques node-exporter 9100/tcp
# La restreindre port par port fragiliserait le cluster sans gain réel sur un
# réseau d'administration de confiance.
- name: Faire confiance aux autres nœuds du cluster (API, kubelet, etcd, VXLAN, Longhorn)
  community.general.ufw:
    rule: allow
    src: "{{ hostvars[item].ansible_host | default(item) }}"
    comment: "noeud {{ item }}"
  loop: "{{ groups['k3s_cluster'] }}"

- name: Autoriser le réseau des pods et des services (préconisation K3s)
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    comment: "k3s pods/services"
  loop:
    - "{{ hardening_pod_cidr }}"
    - "{{ hardening_service_cidr }}"

- name: Autoriser les NodePorts depuis les sources d'administration
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    to_port: "{{ hardening_nodeport_range }}"
    proto: tcp
    comment: "NodePorts 30000-32767"
  loop: "{{ hardening_nodeport_sources }}"
  when: hardening_nodeport_enabled | bool

- name: Politique par défaut, entrant refusé
  community.general.ufw:
    default: deny
    direction: incoming

- name: Politique par défaut, sortant autorisé
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Politique par défaut, trafic routé autorisé (réseau des pods)
  community.general.ufw:
    default: allow
    direction: routed

- name: Activer ufw avec journalisation
  community.general.ufw:
    state: enabled
    logging: low

# ---------- SSH ----------
- name: Durcir SSH (fichier de configuration prioritaire)
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  notify: Recharger sshd

# ---------- Mises à jour de sécurité automatiques ----------
- name: Activer les mises à jour automatiques
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Interdire le redémarrage automatique
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    owner: root
    group: root
    mode: '0644'
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";
