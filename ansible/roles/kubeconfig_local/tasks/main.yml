---
- name: Adapter l'IP du master dans le kubeconfig local
  ansible.builtin.replace:
    path: "{{ local_kubeconfig }}"
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ vip_ip }}:6443"

- name: Ajuster les permissions du fichier kubeconfig
  ansible.builtin.file:
    path: "{{ local_kubeconfig }}"
    mode: '0600'

# ---------- k9s ----------
- name: Vérifier la présence de k9s sur la machine locale
  ansible.builtin.stat:
    path: "{{ kubeconfig_local_k9s_dest }}/k9s"
  register: kubeconfig_local_k9s_binary

- name: Télécharger k9s (version et empreinte vérifiées)
  ansible.builtin.get_url:
    url: "{{ kubeconfig_local_k9s_url }}"
    dest: "{{ kubeconfig_local_download_dir }}/k9s_{{ kubeconfig_local_k9s_version }}.tar.gz"
    checksum: "sha256:{{ kubeconfig_local_k9s_sha256 }}"
    mode: '0600'
  when: not kubeconfig_local_k9s_binary.stat.exists

- name: Installer k9s en local si nécessaire
  ansible.builtin.unarchive:
    src: "{{ kubeconfig_local_download_dir }}/k9s_{{ kubeconfig_local_k9s_version }}.tar.gz"
    dest: "{{ kubeconfig_local_k9s_dest }}/"
    remote_src: true
    include:
      - k9s
    creates: "{{ kubeconfig_local_k9s_dest }}/k9s"
  become: true
  when:
    - not kubeconfig_local_k9s_binary.stat.exists
    - not ansible_check_mode

- name: Supprimer l'archive k9s téléchargée
  ansible.builtin.file:
    path: "{{ kubeconfig_local_download_dir }}/k9s_{{ kubeconfig_local_k9s_version }}.tar.gz"
    state: absent

# ---------- kubelogin ----------
- name: Vérifier la présence de kubelogin
  ansible.builtin.stat:
    path: "{{ kubeconfig_local_kubelogin_dest }}/kubelogin"
  register: kubeconfig_local_kubelogin_binary

- name: Installer unzip (requis pour extraire kubelogin)
  ansible.builtin.apt:
    name: unzip
    state: present
  become: true
  when: not kubeconfig_local_kubelogin_binary.stat.exists

- name: Télécharger kubelogin (version et empreinte vérifiées)
  ansible.builtin.get_url:
    url: "{{ kubeconfig_local_kubelogin_url }}"
    dest: "{{ kubeconfig_local_download_dir }}/kubelogin_{{ kubeconfig_local_kubelogin_version }}.zip"
    checksum: "sha256:{{ kubeconfig_local_kubelogin_sha256 }}"
    mode: '0600'
  when: not kubeconfig_local_kubelogin_binary.stat.exists

- name: Installer kubelogin (plugin kubectl oidc-login)
  ansible.builtin.unarchive:
    src: "{{ kubeconfig_local_download_dir }}/kubelogin_{{ kubeconfig_local_kubelogin_version }}.zip"
    dest: "{{ kubeconfig_local_kubelogin_dest }}/"
    remote_src: true
    include:
      - kubelogin
    creates: "{{ kubeconfig_local_kubelogin_dest }}/kubelogin"
  become: true
  when:
    - not kubeconfig_local_kubelogin_binary.stat.exists
    - not ansible_check_mode

- name: Supprimer l'archive kubelogin téléchargée
  ansible.builtin.file:
    path: "{{ kubeconfig_local_download_dir }}/kubelogin_{{ kubeconfig_local_kubelogin_version }}.zip"
    state: absent

- name: Exposer kubelogin comme plugin kubectl
  ansible.builtin.file:
    src: "{{ kubeconfig_local_kubelogin_dest }}/kubelogin"
    dest: "{{ kubeconfig_local_kubelogin_dest }}/kubectl-oidc_login"
    state: link
    force: true
  become: true

- name: Générer le kubeconfig OIDC
  ansible.builtin.template:
    src: kubeconfig-oidc.yaml.j2
    dest: "{{ kubeconfig_local_oidc_kubeconfig }}"
    mode: '0600'
  vars:
    kubeconfig_local_ca: "{{ (lookup('file', local_kubeconfig) | from_yaml).clusters[0].cluster['certificate-authority-data'] }}"
