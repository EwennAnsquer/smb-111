---
- name: Vérifier la disponibilité de SSH sur les VMs
  hosts: k3s_cluster
  gather_facts: false
  connection: local
  tasks:
    - name: "Attendre SSH sur {{ ansible_host }}"
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        timeout: "{{ ssh_wait_timeout | default(300) }}"
      changed_when: false
