---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-release
  namespace: longhorn-system
spec:
  chart:
    spec:
      chart: longhorn
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn-repo
      version: v1.12.1
  interval: 1m0s
  timeout: 15m
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 3
      strategy: rollback
  values:
    defaultSettings:
      defaultReplicaCount: 2
      deletingConfirmationFlag: true
    persistence:
      defaultClassReplicaCount: 2
