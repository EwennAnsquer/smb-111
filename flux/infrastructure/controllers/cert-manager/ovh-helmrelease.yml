---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-ovh
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: cert-manager-webhook-ovh
      sourceRef:
        kind: HelmRepository
        name: cert-manager-webhook-ovh
        namespace: flux-system
      dependsOn:
        - name: cert-manager
          namespace: flux-system      # le HelmRelease cert-manager est dans flux-system
      install:
        crds: CreateReplace
        remediation:
          retries: -1                 # réessaie indéfiniment au lieu de rester "stalled"
      upgrade:
        remediation:
          retries: -1
  targetNamespace: cert-manager-system
  values:
    groupName: acme.azby.com
    certManager:
      namespace: cert-manager-system
      serviceAccountName: cert-manager
