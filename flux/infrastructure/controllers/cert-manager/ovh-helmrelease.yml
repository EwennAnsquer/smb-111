---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-ovh
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: cert-manager-system
  dependsOn:
    - name: cert-manager
      namespace: flux-system
  chart:
    spec:
      chart: cert-manager-webhook-ovh
      version: 0.9.20
      sourceRef:
        kind: HelmRepository
        name: cert-manager-webhook-ovh
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  values:
    pod:
      securityContext:
        pod:
          runAsNonRoot: true
          runAsGroup: 1000
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault
        container:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
    groupName: acme.azby.com
    certManager:
      namespace: cert-manager-system
      serviceAccountName: cert-manager
