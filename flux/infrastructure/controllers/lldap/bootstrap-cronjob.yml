---
# Applique périodiquement l'état déclaré (groupes + utilisateurs) dans lldap,
# avec le script officiel /app/bootstrap.sh fourni dans l'image lldap.
# Idempotent : on peut le relancer à volonté, et il rattrape tout seul un lldap
# qui n'était pas encore prêt lors d'une exécution précédente.
#
# Lancement immédiat (sans attendre le prochain créneau) :
#   kubectl create job --from=cronjob/lldap-bootstrap bootstrap-now -n lldap-system
#
# ROTATION DES MOTS DE PASSE lldap
# --------------------------------
# 1. Générer des mots de passe uniques et mettre à jour bootstrap-users.enc.yml
#    avec sops (jamais à la main), y compris le compte de service "authelia".
# 2. Reporter le mot de passe de "authelia" dans la clé
#    authentication.ldap.password.txt du Secret authelia-secrets (secret.enc.yml).
# 3. Committer les deux fichiers ensemble, réconcilier infra-controllers, puis
#    redémarrer Authelia et lancer ce Job immédiatement :
#      kubectl rollout restart deployment/authelia -n authelia-system
#      kubectl create job --from=cronjob/lldap-bootstrap bootstrap-now -n lldap-system
# 4. Impact : les nouveaux logins exigent le nouveau mot de passe ; les sessions
#    Authelia et jetons OIDC déjà émis restent valides jusqu'à leur expiration.
#    Si le bind Authelia est désynchronisé, tous les nouveaux logins échouent.
# 5. Rollback : git revert du commit, réconciliation Flux, puis relance du Job
#    (les anciens mots de passe sont alors réappliqués).
# 6. Ne pas modifier les mots de passe via l'UI lldap : ce CronJob les écrase
#    toutes les 10 minutes.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: lldap-bootstrap
  namespace: lldap-system
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: OnFailure
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: bootstrap
              image: lldap/lldap:v0.6.3       # même image que le serveur (contient bootstrap.sh)
              command: ["/app/bootstrap.sh"]  # on court-circuite l'entrypoint du serveur
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: HOME
                  value: /tmp
                - name: LLDAP_URL
                  value: http://lldap.lldap-system.svc.cluster.local:17170
                - name: LLDAP_ADMIN_USERNAME
                  value: admin
                - name: LLDAP_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: lldap-secrets
                      key: admin-password
                # Passe à "true" pour supprimer aussi les utilisateurs/groupes
                # absents des fichiers (état 100 % piloté par git).
                # ⚠️ Vérifie que TOUS tes comptes (dont "authelia") sont déclarés avant.
                - name: DO_CLEANUP
                  value: "false"
              volumeMounts:
                - name: groups
                  mountPath: /bootstrap/group-configs
                  readOnly: true
                - name: users
                  mountPath: /bootstrap/user-configs
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: groups
              configMap:
                name: lldap-bootstrap-groups
            - name: users
              secret:
                secretName: lldap-bootstrap-users
            - name: tmp
              emptyDir: {}
