---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik-system
spec:
  interval: 5m0s
  chart:
    spec:
      chart: traefik
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: traefik-repo
        namespace: traefik-system
  install:
    createNamespace: true
  values:
    ingressRoute:
      dashboard:
        enabled: true
        matchRule: "Host(`dashboard.localhost`)"
        entryPoints:
          - web
    providers:
      kubernetesGateway:
        enabled: true
      kubernetesCRD:
        allowCrossNamespace: true
    gateway:
      listeners:
        web:
          namespacePolicy:
            from: All
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
    additionalArguments:
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.fields.general.defaultmode=keep"
      - "--accesslog.fields.headers.defaultmode=drop"
    deployment:
      replicas: 2
