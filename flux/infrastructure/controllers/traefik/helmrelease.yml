---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik-system
spec:
  interval: 5m0s
  chart:
    spec:
      chart: traefik
      version: "41.6.1"
      sourceRef:
        kind: HelmRepository
        name: traefik-repo
        namespace: traefik-system
  install:
    createNamespace: true
  values:
    ingressRoute:
      dashboard:
        enabled: false
    providers:
      kubernetesGateway:
        enabled: false
      kubernetesCRD:
        allowCrossNamespace: true
    gateway:
      listeners:
        web:
          namespacePolicy:
            from: All
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
    additionalArguments:
      - "--accesslog=true"
      - "--accesslog.format=json"
    deployment:
      replicas: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        memory: 256Mi
