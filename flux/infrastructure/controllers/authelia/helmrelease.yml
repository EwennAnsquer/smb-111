---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: authelia-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: authelia
  chart:
    spec:
      chart: authelia
      # Chart 0.11.x (Authelia 4.39.x). Voir les versions : helm search repo authelia/authelia --versions
      version: '0.11.x'
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: authelia-system
      interval: 12h
  dependsOn:
    - name: traefik
      namespace: traefik-system
  install:
    # Tant que lldap n'est pas déployé, Authelia ne démarre pas (connexion LDAP au boot) :
    # Flux retentera jusqu'à ce que ça passe.
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # ------------------------------------------------------------------
    # Pod
    # ------------------------------------------------------------------
    pod:
      kind: Deployment          # le chart utilise DaemonSet par défaut
      replicas: 1               # SQLite + session en mémoire => 1 seul réplica
      strategy:
        type: Recreate          # évite deux pods sur le même PVC (ReadWriteOnce)
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi         # argon2 est gourmand en mémoire au login

    # SQLite + notifications sur un PVC (StorageClass par défaut de k3s : local-path)
    persistence:
      enabled: true
      size: 1Gi

    # Secrets : on utilise un Secret existant (secret.yml) plutôt que de laisser
    # le chart en générer, pour que les clés soient stables et gérées via GitOps.
    secret:
      existingSecret: authelia-secrets

    # ------------------------------------------------------------------
    # Traefik (k3s) : Ingress standard, comme tes autres apps (ex. longhorn)
    # ------------------------------------------------------------------
    ingress:
      enabled: true
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        cert-manager.io/cluster-issuer: letsencrypt-prod
      tls:
        enabled: true
        secret: authelia-tls    # certificat créé par cert-manager via l'annotation ci-dessus
      traefikCRD:
        enabled: true           # génère les Middlewares Traefik (forwardAuth, chaînes)
        disableIngressRoute: true   # on garde un Ingress standard plutôt qu'une IngressRoute

    # ------------------------------------------------------------------
    # Configuration Authelia (configuration.yaml)
    # ------------------------------------------------------------------
    configMap:
      theme: auto
      log:
        level: info
      identity_providers:
        oidc:
          enabled: true
          hmac_secret:
            secret_name: authelia-oidc
            path: identity_providers.oidc.hmac.key
          jwks:
            - key_id: 'kubernetes-sig'
              use: 'sig'
              algorithm: 'RS256'
              key:
                path: '/secrets/authelia-oidc/oidc.jwks.rsa.4096.pem'
          clients:
            - client_id: 'kubernetes'
              client_name: 'Kubernetes Cluster Access'
              public: true
              require_pkce: true
              pkce_challenge_method: 'S256'
              authorization_policy: 'one_factor'
              redirect_uris:
                - 'http://localhost:8000'
                - 'http://localhost:18000'
              scopes:
                - 'openid'
                - 'profile'
                - 'email'
                - 'groups'

      server:
        endpoints:
          # Crée l'endpoint /api/authz/forward-auth utilisé par Traefik
          automatic_authz_implementations:
            - ForwardAuth

      # Domaine de cookie + URL du portail : https://auth.smb-111.azby.fr
      session:
        cookies:
          - domain: smb-111.azby.fr
            subdomain: auth
            default_redirection_url: https://longhorn.smb-111.azby.fr

      storage:
        local:
          enabled: true
          path: /config/db.sqlite3

      # Pas de SMTP pour l'instant : les codes/liens sont écrits dans un fichier
      # (kubectl exec -n authelia-system deploy/authelia -- cat /config/notification.txt)
      notifier:
        filesystem:
          enabled: true
          filename: /config/notification.txt

      authentication_backend:
        password_reset:
          disable: true    # le compte bind est en lecture seule
        password_change:
          disable: true
        ldap:
          enabled: true
          implementation: lldap
          address: ldap://lldap.lldap-system.svc.cluster.local:3890
          base_dn: dc=azby,dc=fr
          user: uid=authelia,ou=people,dc=azby,dc=fr

      access_control:
        default_policy: deny
        rules:
          - domain: 'lldap.smb-111.azby.fr'
            policy: one_factor
            subject: 'group:admin'
          - domain: 'longhorn.smb-111.azby.fr'
            policy: one_factor
            subject: 'group:admin'
          - domain:
              - 'grafana.smb-111.azby.fr'
              - 'vmui.smb-111.azby.fr'
              - 'vmalert.smb-111.azby.fr'
              - 'alertmanager.smb-111.azby.fr'
            policy: one_factor
            subject: 'group:admins'
          - domain: '*.smb-111.azby.fr'
            policy: one_factor
