---
# Certificat de repli : le Secret est émis par le Certificate wildcard-azby-fr
# de flux/infrastructure/configs/cert-manager, dans ce même namespace.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: traefik-system
spec:
  defaultCertificate:
    secretName: wildcard-azby-fr-tls

