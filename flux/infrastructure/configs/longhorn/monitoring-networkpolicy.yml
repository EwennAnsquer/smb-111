---
# Le chart Longhorn restreint l'accès au port 9500 (API + métriques) aux pods
# Longhorn. Cette politique additive autorise uniquement le scrape des métriques
# par vmagent (namespace monitoring-system), sans ouvrir l'API au reste du cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-allow-monitoring
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring-system
      ports:
        - protocol: TCP
          port: 9500
