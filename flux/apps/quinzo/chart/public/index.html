<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15113a">
<title>Quinzo — Jouer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🎉%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
<style>
  body { min-height: 100dvh; }
  .app { max-width: 560px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px 28px; min-height: 100dvh; display: flex; flex-direction: column; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  header.top .logo { font-size: 1.4em; }
  .me-chip { display: flex; align-items: center; gap: 8px; background: var(--surface2); padding: 6px 12px 6px 8px; border-radius: 99px; font-weight: 800; }
  .me-chip .av { font-size: 1.3em; }
  [data-screen] { flex: 1; display: flex; flex-direction: column; }

  /* Rejoindre */
  .join-hero { text-align: center; margin: 4vh 0 22px; }
  .join-hero .logo { font-size: 3em; }
  .pin-input { font-size: 1.8em; font-weight: 900; text-align: center; letter-spacing: .4em; }
  .avatars { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px; }
  .avatars button { font-size: 1.35em; padding: 0; aspect-ratio: 1; min-width: 0; border-radius: 12px; background: var(--surface); border: 2px solid transparent; }
  .avatars button.sel { border-color: var(--accent); background: rgba(255, 210, 63, 0.15); transform: scale(1.05); }

  /* Attente */
  .wait-box { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; }
  .big-av { font-size: 5.5em; line-height: 1; }
  .dots::after { content: ""; animation: dots 1.5s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  /* Question */
  .q-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; font-weight: 800; }
  .q-text { font-size: 1.35em; font-weight: 900; line-height: 1.25; margin: 14px 0 16px; }
  .q-img { width: 100%; max-height: 32vh; object-fit: contain; border-radius: 14px; margin-bottom: 12px; background: rgba(0,0,0,.2); }
  .choices .choice { min-height: 104px; }
  .vf .choice { justify-content: center; font-size: 1.5em; min-height: 120px; }
  .sent { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; }
  .sent .emoji { font-size: 4em; }
  .est-value { font-size: 2.6em; font-weight: 900; text-align: center; margin: 8px 0; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 36px; }
  .est-input { font-size: 1.6em; text-align: center; font-weight: 900; }
  .text-input { font-size: 1.3em; font-weight: 800; }
  .actions { margin-top: 16px; display: flex; gap: 10px; }
  .actions .btn { flex: 1; }

  /* Résultat */
  .result { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; border-radius: 24px; padding: 26px 18px; margin-top: 4px; }
  .result.good { background: linear-gradient(160deg, rgba(34,197,94,.35), rgba(34,197,94,.08)); }
  .result.bad { background: linear-gradient(160deg, rgba(239,68,68,.35), rgba(239,68,68,.08)); }
  .result.mid { background: linear-gradient(160deg, rgba(245,179,1,.35), rgba(245,179,1,.08)); }
  .result .emoji { font-size: 4.5em; line-height: 1; }
  .result h2 { margin: 6px 0 0; font-size: 1.9em; }
  .result .pts { font-size: 2.2em; font-weight: 900; color: var(--accent); }
  .answer-box { background: rgba(0,0,0,.22); border-radius: 14px; padding: 12px 16px; margin-top: 8px; width: 100%; }
  .answer-box small { display: block; color: var(--muted); font-weight: 700; margin-bottom: 2px; }
  .answer-box b { font-size: 1.15em; }
  .expl { font-size: 0.95em; color: var(--muted); margin-top: 6px; }
  .rank-line { margin-top: 14px; font-weight: 800; font-size: 1.1em; }

  /* Réponses des autres */
  .who { margin-top: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .who-avs { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; font-size: 1.7em; }
  .who-avs span { opacity: .25; filter: grayscale(1); transition: all .3s; }
  .who-avs span.done { opacity: 1; filter: none; animation: pop .3s both; }
  .others-title { margin: 22px 0 10px; font-size: .95em; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .bars { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .bar-row { padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 2px solid transparent; }
  .bar-row.ok { border-color: var(--good); background: rgba(34,197,94,.1); }
  .bar-label { display: flex; justify-content: space-between; gap: 10px; font-weight: 800; margin-bottom: 6px; }
  .bar-row.ok .bar-label span::after { content: " ✓"; color: var(--good); }
  .bar { height: 10px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; transition: width .6s ease; }
  .bar-who { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; font-size: .85em; font-weight: 700; }
  .bar-who span { background: rgba(255,255,255,.08); padding: 3px 9px; border-radius: 99px; }
  .ans-list { display: flex; flex-direction: column; gap: 6px; }
  .ans-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
  .ans-row.me { border-color: var(--accent); background: rgba(255,210,63,.1); }
  .ans-row .av { font-size: 1.5em; }
  .ans-row .nm { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ans-row .given { color: var(--muted); font-size: .9em; overflow-wrap: anywhere; }
  .ans-row .p { font-weight: 900; color: var(--accent); min-width: 52px; text-align: right; }

  /* Fin */
  .final-rank { font-size: 4.5em; font-weight: 900; line-height: 1; background: linear-gradient(90deg, var(--accent), var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <span class="logo"><span class="dot"></span><b>Quinzo</b></span>
    <div class="row" style="gap:8px">
      <a class="btn small" id="adminBtn" href="/host" title="Ouvrir l'écran hôte (gestion de la partie)">🖥️ Écran hôte</a>
      <div class="me-chip hidden" id="meChip"><span class="av" id="meAv"></span><span id="meScore">0</span></div>
    </div>
  </header>

  <!-- Rejoindre -->
  <section data-screen="join">
    <div class="join-hero">
      <span class="logo"><span class="dot"></span><b>Quinzo</b></span>
      <p class="muted">Choisis un pseudo et un avatar pour rejoindre la partie.</p>
    </div>
    <form id="joinForm" class="card" autocomplete="off">
      <label class="lbl" for="pin">Code de la partie</label>
      <input class="input pin-input" id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="• • • •" required>
      <p class="muted" style="font-size:.85em;margin:6px 2px 16px">Le code est affiché sur l'écran de l'hôte.</p>
      <label class="lbl" for="name">Pseudo</label>
      <input class="input" id="name" maxlength="16" placeholder="Ton pseudo" required style="font-size:1.2em;font-weight:800">
      <label class="lbl" style="margin-top:16px">Avatar</label>
      <div class="avatars" id="avatars"></div>
      <button class="btn primary big" style="width:100%;margin-top:20px" type="submit">C'est parti ! 🚀</button>
    </form>
    <p class="center muted" id="connStatus" style="margin-top:14px"></p>
  </section>

  <!-- Attente -->
  <section data-screen="wait" class="hidden">
    <div class="wait-box">
      <div class="big-av pop" id="waitAv"></div>
      <h2 style="margin:6px 0 0" id="waitName"></h2>
      <p style="font-weight:800;font-size:1.15em;margin:4px 0" id="waitMsg">Tu es dans la partie ! 🎉</p>
      <p class="muted"><span id="waitSub">En attente du lancement par l'hôte</span><span class="dots"></span></p>
      <p class="chip" id="waitCount"></p>
    </div>
    <button class="btn small" id="leaveBtn" style="align-self:center;margin-top:20px">Changer de pseudo</button>
  </section>

  <!-- Question -->
  <section data-screen="question" class="hidden">
    <div class="q-meta">
      <span class="chip" id="qTheme"></span>
      <span class="muted" id="qNum"></span>
    </div>
    <div class="timer-bar" id="qTimer"><i></i></div>
    <div class="q-text" id="qText"></div>
    <img class="q-img hidden" id="qImg" alt="">
    <div id="qAnswer" style="flex:1;display:flex;flex-direction:column"></div>
  </section>

  <!-- Résultat -->
  <section data-screen="reveal" class="hidden">
    <div class="result pop" id="res"></div>
    <div id="others"></div>
  </section>

  <!-- Classement -->
  <section data-screen="leaderboard" class="hidden">
    <h2 class="center" style="margin:6px 0 4px">Classement</h2>
    <p class="center muted" id="lbMine" style="margin:0 0 16px;font-weight:800"></p>
    <div class="lb" id="lbList"></div>
  </section>

  <!-- Fin -->
  <section data-screen="end" class="hidden">
    <div class="wait-box" style="flex:none;margin:3vh 0 18px">
      <div style="font-size:3.5em" id="endEmoji">🏆</div>
      <div class="final-rank" id="endRank"></div>
      <p style="font-weight:800;font-size:1.2em;margin:0" id="endMsg"></p>
      <p class="muted" style="margin:0" id="endSub"></p>
    </div>
    <div class="lb" id="endList"></div>
  </section>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/common.js"></script>
<script src="/js/player.js"></script>
</body>
</html>
