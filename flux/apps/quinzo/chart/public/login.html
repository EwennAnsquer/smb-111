<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Quinzo — Connexion admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🎉%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/style.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 20px; }
  .box { width: min(420px, 100%); }
  .box .logo { font-size: 2.4em; display: flex; justify-content: center; margin-bottom: 6px; }
  .field { margin-top: 14px; }
  .err { color: #fca5a5; font-weight: 700; min-height: 1.4em; margin: 12px 0 0; }
</style>
</head>
<body>
  <div class="box">
    <span class="logo"><span class="dot"></span><b>Quinzo</b></span>
    <p class="muted center" style="margin:0 0 18px">Espace administrateur : écran hôte et éditeur de thèmes</p>
    <form class="card" id="form" autocomplete="on">
      <div><label class="lbl" for="username">Identifiant</label><input class="input" id="username" name="username" autocomplete="username" required autofocus></div>
      <div class="field"><label class="lbl" for="password">Mot de passe</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" required></div>
      <p class="err" id="err" role="alert"></p>
      <button class="btn primary big" style="width:100%;margin-top:6px" id="btn">Se connecter</button>
    </form>
    <p class="muted center" style="font-size:.9em;margin-top:16px">Tu veux jouer ? Va sur <a href="/">la page joueur</a>.</p>
  </div>
<script src="/js/common.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  // n'accepte qu'une redirection interne (pas de //site-externe)
  const nextUrl = /^\/(?!\/)[\w\-/?=&%.]*$/.test(params.get('next') || '') ? params.get('next') : '/host';
  fetch('/api/me').then((r) => r.json()).then((me) => { if (me.authenticated) location.replace(nextUrl); });
  $('#form').onsubmit = async (e) => {
    e.preventDefault();
    $('#btn').disabled = true;
    $('#err').textContent = '';
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: $('#username').value, password: $('#password').value }) });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || 'Connexion impossible');
      location.replace(nextUrl);
    } catch (err) {
      $('#err').textContent = err.message;
      $('#password').value = '';
      $('#password').focus();
    } finally { $('#btn').disabled = false; }
  };
</script>
</body>
</html>
