{{- if and .Values.podDisruptionBudget.enabled (include "quinzo.multi" .) (gt (int .Values.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "quinzo.fullname" . }}
  labels:
    {{- include "quinzo.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "quinzo.selectorLabels" . | nindent 6 }}
{{- end }}
