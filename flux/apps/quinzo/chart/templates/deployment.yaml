apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quinzo.fullname" . }}
  labels:
    {{- include "quinzo.labels" . | nindent 4 }}
spec:
  # Une seule réplique : l'état de la partie est en mémoire.
  replicas: 1
  # Recreate : jamais deux pods en même temps (état + volume ReadWriteOnce).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "quinzo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.quinzo.adminKey.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quinzo.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "quinzo.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: quinzo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Lancement direct, sans le script d'entrée Docker (fsGroup gère les droits sur /data)
          command: ["node", "server.js"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: DATA_DIR
              value: /data
            - name: IN_DOCKER
              value: "1"
            - name: NO_OPEN
              value: "1"
            - name: TRUST_CLIENT_IP
              value: {{ ternary "1" "0" .Values.quinzo.trustClientIp | quote }}
            - name: MAX_PLAYERS
              value: {{ .Values.quinzo.maxPlayers | quote }}
            {{- with (include "quinzo.publicUrl" .) }}
            - name: PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.quinzo.pin }}
            - name: PIN
              value: {{ . | toString | quote }}
            {{- end }}
            - name: ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "quinzo.secretName" . }}
                  key: {{ include "quinzo.secretKey" . }}
            {{- with .Values.quinzo.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /api/themes
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/themes
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/themes
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "quinzo.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

