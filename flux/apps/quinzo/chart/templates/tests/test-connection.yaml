apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "quinzo.fullname" . }}-test"
  labels:
    {{- include "quinzo.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: busybox:1.36
      # l'appli répond et son stockage (Redis) est joignable
      command: ["wget", "-qO-", "http://{{ include "quinzo.fullname" . }}:{{ .Values.service.port }}/readyz"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
