{{- $adminFromValues := and .Values.admin.enabled (not .Values.admin.existingSecret) }}
{{- $redisBuiltin := .Values.redis.enabled }}
{{- $redisExtPw := and (not .Values.redis.enabled) .Values.externalRedis.url .Values.externalRedis.password (not .Values.externalRedis.existingSecret) }}
{{- if or $adminFromValues $redisBuiltin $redisExtPw }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quinzo.fullname" . }}
  labels:
    {{- include "quinzo.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $adminFromValues }}
  admin-username: {{ .Values.admin.username | b64enc | quote }}
  {{- if .Values.admin.passwordHash }}
  admin-password-hash: {{ .Values.admin.passwordHash | b64enc | quote }}
  {{- else }}
  admin-password: {{ include "quinzo.secretValue" (dict "ctx" . "key" "admin-password" "value" .Values.admin.password "length" 20) | b64enc | quote }}
  {{- end }}
  {{- end }}
  {{- if $redisBuiltin }}
  {{- $rpw := include "quinzo.secretValue" (dict "ctx" . "key" "redis-password" "value" .Values.redis.password "length" 32) }}
  redis-password: {{ $rpw | b64enc | quote }}
  redis.conf: {{ printf "requirepass %s\nappendonly yes\nappendfsync everysec\nsave \"\"\ndir /data\nprotected-mode no\nport 6379\n" $rpw | b64enc | quote }}
  {{- else if $redisExtPw }}
  redis-password: {{ .Values.externalRedis.password | b64enc | quote }}
  {{- end }}
{{- end }}
