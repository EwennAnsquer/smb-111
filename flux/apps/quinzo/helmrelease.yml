apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: quinzo
  namespace: quinzo
spec:
  interval: 10m
  chart:
    spec:
      chart: ./flux/apps/quinzo/chart
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      tag: "1.0.1"
    ingress:
      enabled: true
      className: traefik
      host: quinzo.smb-111.azby.fr
