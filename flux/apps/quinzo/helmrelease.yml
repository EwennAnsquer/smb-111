apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: quinzo
  namespace: quinzo
spec:
  interval: 10m
  chart:
    spec:
      chart: ./flux/apps/quinzo/chart
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    image:
      repository: azby/smb-111
      tag: "1.0.1"
    ingress:
      enabled: true
      className: traefik
      host: quinzo.smb-111.azby.fr
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        traefik.ingress.kubernetes.io/router.middlewares: authelia-system-forwardauth-authelia@kubernetescrd
      tls:
        enabled: true
        secretName: quinzo-tls
